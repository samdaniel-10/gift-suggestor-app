<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Suggestor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        header {
            background: linear-gradient(90deg, #000000 0%, #1a1a1a 100%);
            color: beige;
            height: 10vh;
            min-height: 65px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }

        .main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            margin-left: 2%;
            margin-right: 5%;
        }

        .main h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        

        .main2 {
            display: flex;
            gap: 32px;
            justify-content: space-between;
            align-items: center;
        }

        .main2 a {
            position: relative;
            color: #f1e9d8;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 2px;
            transition: color 0.25s ease;
        }

        .main2 a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #ffd54f, #ff8a80);
            transition: width 0.25s ease;
        }

        .main2 a:hover {
            color: #ffffff;
            text-decoration: none;
        }

        .main2 a:hover::after {
            width: 100%;
        }

        /* Mobile hamburger toggle */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .menu-toggle span {
            width: 26px;
            height: 3px;
            background-color: beige;
            border-radius: 2px;
        }

        @media (max-width: 700px) {
            .menu-toggle {
                display: flex;
            }

            .main2 {
                position: absolute;
                top: 10vh;
                left: 0;
                right: 0;
                background: #111111;
                flex-direction: column;
                align-items: flex-start;
                gap: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease;
            }

            .main2.open {
                max-height: 300px;
            }

            .main2 div {
                width: 100%;
            }

            .main2 a {
                display: block;
                width: 100%;
                padding: 16px 6%;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .main2 a::after {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="main">
            <div><h1>🎁 Gift Suggestor</h1></div>

            <div class="menu-toggle" onclick="document.querySelector('.main2').classList.toggle('open')">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="main2">
                <div><a href="{% url 'homepage' %}">Home</a></div>
                <div><a href="#">About</a></div>
                <div><a href="#">Settings</a></div>
                <div><a href="#">My Profile</a></div>
            </div>
        </div>
    </header>

</body>
</html>
