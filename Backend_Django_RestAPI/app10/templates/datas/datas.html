<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="2" width="100%">
        {% for x in userdata %}
        <tr>
            <td>{{ x.fullname }}</td>
            <td>{{ x.email }}</td>
            <td>{{ x.mobile_no }}</td>
            <td>{{ x.username }}</td>
            <td>{{ x.password }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
