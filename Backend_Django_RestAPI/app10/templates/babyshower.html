
{% extends 'base.html' %}

{% block content %}

<style>

    /* =========================================
       Baby Shower Gift Suggestor
       Page-specific styling
       Does NOT affect header or footer
       ========================================= */

    .baby-shower-page {
        min-height: 90vh;

        position: relative;
        overflow: hidden;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding: 50px 20px;

        background:
            radial-gradient(
                circle at 8% 18%,
                rgba(255, 182, 193, 0.38),
                transparent 30%
            ),
            radial-gradient(
                circle at 92% 15%,
                rgba(173, 216, 230, 0.40),
                transparent 30%
            ),
            radial-gradient(
                circle at 80% 90%,
                rgba(221, 160, 221, 0.30),
                transparent 35%
            ),
            linear-gradient(
                135deg,
                #fff5f8,
                #f2f8ff,
                #faf5ff
            );
    }


    /* =========================================
       Decorative Background Circles
       ========================================= */

    .baby-shower-page::before {
        content: "";

        position: absolute;

        width: 300px;
        height: 300px;

        top: -120px;
        left: -90px;

        border-radius: 50%;

        background: rgba(244, 114, 182, 0.12);

        filter: blur(5px);
    }


    .baby-shower-page::after {
        content: "";

        position: absolute;

        width: 350px;
        height: 350px;

        right: -120px;
        bottom: -150px;

        border-radius: 50%;

        background: rgba(96, 165, 250, 0.12);

        filter: blur(5px);
    }


    /* =========================================
       Page Title
       Only affects Baby Shower title
       ========================================= */

    .baby-shower-page .baby-shower-title {
        position: relative;
        z-index: 2;

        margin: 0 0 10px;

        text-align: center;

        font-size: 30px;

        font-weight: 700;

        color: #1e215a;

        letter-spacing: 0.3px;
    }


    /* =========================================
       Description
       ========================================= */

    .baby-shower-page .baby-shower-description {
        position: relative;
        z-index: 2;

        width: 100%;
        max-width: 650px;

        padding: 0 10px;

        margin-bottom: 25px;

        text-align: center;

        color: #51485a;

        font-size: 18px;

        font-weight: 500;

        line-height: 1.7;
    }


    /* Decorative Line */

    .baby-shower-page .baby-shower-description::after {
        content: "";

        display: block;

        width: 70px;
        height: 4px;

        margin: 14px auto 0;

        border-radius: 10px;

        background:
            linear-gradient(
                90deg,
                #f472b6,
                #a78bfa,
                #60a5fa
            );
    }


    /* =========================================
       Form Card
       ========================================= */

    .baby-shower-page .baby-shower-form {
        position: relative;
        z-index: 2;

        width: 100%;
        max-width: 650px;

        padding: 38px 42px;

        background: rgba(255, 255, 255, 0.94);

        border: 1px solid rgba(255, 255, 255, 0.85);

        border-radius: 22px;

        box-shadow:
            0 20px 50px rgba(80, 70, 120, 0.15),
            0 5px 15px rgba(0, 0, 0, 0.05);

        backdrop-filter: blur(10px);
    }


    /* Top Gradient Border */

    .baby-shower-page .baby-shower-form::before {
        content: "";

        position: absolute;

        top: 0;
        left: 12%;
        right: 12%;

        height: 4px;

        border-radius: 0 0 10px 10px;

        background:
            linear-gradient(
                90deg,
                #f472b6,
                #a78bfa,
                #60a5fa
            );
    }


    /* =========================================
       Labels
       ========================================= */

    .baby-shower-page .baby-shower-form label {
        display: block;

        margin-top: 20px;
        margin-bottom: 8px;

        color: #403945;

        font-size: 15px;

        font-weight: 650;

        letter-spacing: 0.2px;
    }


    .baby-shower-page .baby-shower-form label:first-of-type {
        margin-top: 0;
    }


    /* =========================================
       Dropdowns
       ========================================= */

    .baby-shower-page .baby-shower-form select {
        appearance: none;
        -webkit-appearance: none;

        width: 100%;

        padding: 13px 45px 13px 15px;

        border: 1.5px solid #ddd8e7;

        border-radius: 11px;

        background-color: #fbfaff;

        color: #443d49;

        font-family: Arial, Helvetica, sans-serif;

        font-size: 15px;

        cursor: pointer;

        outline: none;

        transition:
            border-color 0.25s ease,
            box-shadow 0.25s ease,
            background-color 0.25s ease,
            transform 0.2s ease;

        /* Custom Dropdown Arrow */

        background-image:
            linear-gradient(
                45deg,
                transparent 50%,
                #8b5cf6 50%
            ),
            linear-gradient(
                135deg,
                #8b5cf6 50%,
                transparent 50%
            );

        background-position:
            calc(100% - 19px) 50%,
            calc(100% - 13px) 50%;

        background-size:
            6px 6px,
            6px 6px;

        background-repeat: no-repeat;
    }


    /* Dropdown Hover */

    .baby-shower-page .baby-shower-form select:hover {
        background-color: #ffffff;

        border-color: #c4b5fd;

        transform: translateY(-1px);

        box-shadow:
            0 4px 12px rgba(139, 92, 246, 0.10);
    }


    /* Dropdown Focus */

    .baby-shower-page .baby-shower-form select:focus {
        background-color: #ffffff;

        border-color: #8b5cf6;

        box-shadow:
            0 0 0 4px rgba(139, 92, 246, 0.11),
            0 5px 15px rgba(139, 92, 246, 0.08);
    }


    /* Dropdown Options */

    .baby-shower-page .baby-shower-form option {
        padding: 10px;

        background: #ffffff;

        color: #333333;
    }


    /* =========================================
       Submit Button
       ========================================= */

    .baby-shower-page .baby-shower-form button[type="submit"] {
        width: 100%;

        margin-top: 32px;

        padding: 14px 20px;

        border: none;

        border-radius: 12px;

        background:
            linear-gradient(
                135deg,
                #381b69,
                #a78bfa,
                #60a5fa
            );

        background-size: 200% 200%;

        color: #ffffff;

        font-size: 16px;

        font-weight: 600;

        letter-spacing: 0.2px;

        cursor: pointer;

        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease,
            background-position 0.4s ease;
    }


    /* Button Hover */

    .baby-shower-page .baby-shower-form button[type="submit"]:hover {
        transform: translateY(-3px);

        background-position: 100% 50%;

        box-shadow:
            0 10px 25px rgba(139, 92, 246, 0.25);
    }


    /* Button Active */

    .baby-shower-page .baby-shower-form button[type="submit"]:active {
        transform: translateY(-1px);

        box-shadow:
            0 5px 12px rgba(139, 92, 246, 0.18);
    }


    /* =========================================
       Responsive Design
       ========================================= */

    @media (max-width: 600px) {

        .baby-shower-page {
            padding: 35px 15px;
        }


        .baby-shower-page .baby-shower-title {
            font-size: 25px;
        }


        .baby-shower-page .baby-shower-description {
            font-size: 16px;
        }


        .baby-shower-page .baby-shower-form {
            padding: 32px 22px;

            border-radius: 18px;
        }


        .baby-shower-page .baby-shower-form label {
            font-size: 14px;
        }


        .baby-shower-page .baby-shower-form select {
            padding: 12px 42px 12px 13px;

            font-size: 14px;
        }


        .baby-shower-page .baby-shower-form button[type="submit"] {
            font-size: 15px;

            padding: 13px;
        }
    }

</style>


<!-- =========================================
     Baby Shower Gift Suggestor Page
     ========================================= -->

<main class="baby-shower-page">


    <!-- Page Title -->

    <h1 class="baby-shower-title">
       🍼 Baby Shower Gift Suggestor
    </h1>


    <!-- Description -->

    <p class="baby-shower-description">
        Select your preferences to get a suitable
        baby shower gift suggestion.
    </p>


    <!-- Baby Shower Form -->

    <form
        class="baby-shower-form"
        action="babyshowersuggestionprocess/"
        method="POST"
    >

        {% csrf_token %}


        <!-- Budget -->

        <label for="budget">
            Budget
        </label>

        <select name="budget" id="budget" required>

            <option value="">
                Select Budget
            </option>

            <option value="Below ₹500">
                Below ₹500
            </option>

            <option value="₹500 to ₹1,000">
                ₹500 to ₹1,000
            </option>

            <option value="₹1,000 to ₹2,500">
                ₹1,000 to ₹2,500
            </option>

            <option value="₹2,500 to ₹5,000">
                ₹2,500 to ₹5,000
            </option>

            <option value="Above ₹5,000">
                Above ₹5,000
            </option>

        </select>


        <!-- Gift Type -->

        <label for="gift_type">
            Gift Type
        </label>

        <select name="gift_type" id="gift_type" required>

            <option value="">
                Select Gift Type
            </option>

            <option value="Useful">
                Useful
            </option>

            <option value="Personalized">
                Personalized
            </option>

            <option value="Handmade">
                Handmade
            </option>

            <option value="Celebration">
                Celebration
            </option>

        </select>


        <!-- Category -->

        <label for="category">
            Category
        </label>

        <select name="category" id="category" required>

            <option value="">
                Select Category
            </option>

            <option value="Baby Clothing">
                Baby Clothing
            </option>

            <option value="Baby Care">
                Baby Care
            </option>

            <option value="Toys & Games">
                Toys & Games
            </option>

            <option value="Nursery & Decor">
                Nursery & Decor
            </option>

            <option value="Mom & Baby">
                Mom & Baby
            </option>

        </select>


        <!-- Gift Preference -->

        <label for="gift_preferences">
            Gift Preference
        </label>

        <select
            name="gift_preferences"
            id="gift_preferences"
            required
        >

            <option value="">
                Select Gift Preference
            </option>

            <option value="Practical">
                Practical
            </option>

            <option value="Cute">
                Cute
            </option>

            <option value="Personalized">
                Personalized
            </option>

            <option value="Creative">
                Creative
            </option>

        </select>


        <!-- Submit Button -->

        <button type="submit">
            🍼 &nbsp; Suggest Gift
        </button>

    </form>

</main>

{% endblock %}
